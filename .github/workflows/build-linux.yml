name: Build Linux

# Solo su richiesta (gh workflow run), come il Mac: si costruisce quando si pubblica una versione.
# Runner ubuntu-22.04: l'AppImage chiede la glibc della macchina di build, così gira da Ubuntu 22.04 in su.
on:
  workflow_dispatch:
  push:  # PROVVISORIO: solo per provare dal ramo «linux» prima che il file sia su main; togliere prima del merge
    branches: ['linux']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # solo sul runner: librerie per far girare Qt senza schermo e un portachiavi vero per le prove
      - name: Prepara il runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 gnome-keyring dbus-x11 desktop-file-utils
      - name: Build
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          dbus-run-session -- bash -c 'printf "prova-ci" | gnome-keyring-daemon --unlock --components=secrets >/dev/null && bash linux/build_linux.sh'
      # l'AppImage va nella release del repo (lo spazio degli artifact di Actions è condiviso e si riempie);
      # la release si crea solo da main: le prove sui rami non devono comparire pubbliche
      - name: Carica l'AppImage nella release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(python3 -c "import re;print(re.search(r'VERSION = \"(.+)\"', open('tkftp/__init__.py').read()).group(1))")"
          TAG="v$V"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "tk-ftp $V" --notes "Build automatica" --target "$GITHUB_SHA" || true
          for i in 1 2 3 4 5; do
            gh release upload "$TAG" dist/*.AppImage dist/selftest-linux-*.png dist/test-core-linux-*.txt --clobber && break
            sleep 8
          done
          gh release view "$TAG" --json assets --jq '.assets[].name'
      - uses: actions/upload-artifact@v4
        if: failure()
        continue-on-error: true
        with:
          name: selftest-linux
          path: |
            dist/selftest-*.png
            dist/*.txt
            build/appimagetool.log
          retention-days: 3
          if-no-files-found: ignore
